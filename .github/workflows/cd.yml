name: CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set vars
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Package
        run: mvn clean verify
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: build-jar
          path: target/bitwise-*-jar-with-dependencies.jar
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-ubuntu
          path: target/jpackage/*

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Package
        run: mvn clean verify
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: target/jpackage/*

  macos:
    name: MacOS (Arm)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set vars
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Package
        run: mvn clean verify -Pmacos
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-macos
          path: target/jpackage/*

  release:
    name: Continuous Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - ubuntu
      - windows
      - macos
    steps:
      - uses: actions/checkout@v5
      - name: Set vars
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Download appimage
        uses: actions/download-artifact@v8
        with:
          name: build-ubuntu
          path: .
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: build-windows
          path: .
      - name: Download MacOS build
        uses: actions/download-artifact@v8
        with:
          name: build-macos
          path: .
      - name: Configure tag
        run: |
          git tag --force continuous ${{ steps.vars.outputs.sha_short }}
          git push --tags --force
      - name: Check directory
        run: ls
      - name: Rename files
        run: |
          find . -type f -name '*.deb' -exec sh -c 'x="{}"; mv "$x" "bitwise-${{ steps.vars.outputs.sha_short }}-ubuntu.deb"' \;
          find . -type f -name '*.exe' -exec sh -c 'x="{}"; mv "$x" "bitwise-${{ steps.vars.outputs.sha_short }}-windows.exe"' \;
          find . -type f -name '*.dmg' -exec sh -c 'x="{}"; mv "$x" "bitwise-${{ steps.vars.outputs.sha_short }}-macos.dmg"' \;
          find . -type f -name '*.jar' -exec sh -c 'x="{}"; mv "$x" "bitwise-${{ steps.vars.outputs.sha_short }}-universal.jar"' \;
      - name: Check directory
        run: ls
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          draft: false
          prerelease: true
          name: Continuous
          tag: continuous
          body: This is an automated build of the latest source code. While it'll probably work, there's always a chance it'll crash, corrupt your data, eat your kittens, etc. Triggered by commit ${{ github.sha }} (@${{ github.actor }}).
          artifacts: "bitwise-${{ steps.vars.outputs.sha_short }}-ubuntu.deb,bitwise-${{ steps.vars.outputs.sha_short }}-windows.exe,bitwise-${{ steps.vars.outputs.sha_short }}-macos.dmg,bitwise-${{ steps.vars.outputs.sha_short }}-universal.jar"
